<!doctype html>
<html lang="en" data-preload>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rayina Ilham — Ten films, ten games</title>
<meta name="description" content="A personal media shelf: ten films and ten games on one curved ribbon of discs, curated by Rayina Ilham.">
<link rel="stylesheet" href="./styles/tokens.css">
<link rel="stylesheet" href="./styles/page.css">
<link rel="stylesheet" href="./styles/preloader.css">
<link rel="stylesheet" href="./styles/detail.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/": "./vendor/three/",
    "gsap": "./vendor/gsap/index.js",
    "gsap/CustomEase": "./vendor/gsap/CustomEase.js",
    "gsap/SplitText": "./vendor/gsap/SplitText.js"
  }
}
</script>
</head>
<body>

<!-- ── loader ─────────────────────────────────────────────────────────── -->
<div class="preloader" data-preloader>
  <p class="preloader__count heading-l" data-counter
     aria-hidden="true">
    <span class="preloader__cell preloader__cell--glyph">
      <span class="preloader__shell"><span class="preloader__glyph" data-counter-glyph>R</span></span>
    </span><span class="preloader__cell preloader__cell--drum">
      <span class="preloader__shell"><span class="preloader__drum" data-counter-drum></span></span>
    </span><span class="preloader__cell preloader__cell--drum">
      <span class="preloader__shell"><span class="preloader__drum" data-counter-drum></span></span>
    </span>
  </p>

  <div class="preloader__side preloader__side--left">
    <span class="preloader__side-line"><span class="preloader__side-inner">Rayina Ilham — Shelf</span></span>
  </div>

  <div class="preloader__side preloader__side--right" data-year-drum-root>
    <span class="preloader__side-line"><span class="preloader__side-inner preloader__years">
      <span class="preloader__cell preloader__cell--drum"><span class="preloader__shell"><span class="preloader__drum" data-year-drum></span></span></span><span class="preloader__cell preloader__cell--drum"><span class="preloader__shell"><span class="preloader__drum" data-year-drum></span></span></span><span class="preloader__cell preloader__cell--drum"><span class="preloader__shell"><span class="preloader__drum" data-year-drum></span></span></span><span class="preloader__cell preloader__cell--drum"><span class="preloader__shell"><span class="preloader__drum" data-year-drum></span></span></span>
    </span></span>
  </div>
</div>

<!-- ── nav ────────────────────────────────────────────────────────────── -->
<nav class="nav" aria-label="Shelf">
  <ul class="nav__list">
    <li class="nav__item nav__item--brand">
      <span class="nav__mask"><span class="nav__brand" data-nav-intro>Rayina Ilham</span></span>
    </li>
    <li class="nav__item nav-loading-item">
      <span class="nav__mask"><span class="nav-loading" data-nav-intro>
        <span class="nav-loading__spinner" data-nav-spinner></span>
        <span class="nav-link__label" data-nav-loading-label>Projecting</span>
      </span></span>
    </li>
    <li class="nav__item nav__item--switch">
      <span class="nav__mask"><button type="button" class="nav__switch" data-nav-reveal data-shelf-switch="films">Films</button></span>
    </li>
    <li class="nav__item nav__item--switch">
      <span class="nav__mask"><button type="button" class="nav__switch" data-nav-reveal data-shelf-switch="games">Games</button></span>
    </li>
  </ul>
</nav>

<!-- ── canvas ─────────────────────────────────────────────────────────── -->
<canvas data-disc-canvas aria-hidden="true"></canvas>

<main>
  <div data-disc-gallery
       data-lenis-prevent
       data-lenis-prevent-wheel
       tabindex="0"
       role="group"
       aria-label="Disc shelf. Left and right arrow keys move between discs, Enter turns the selected disc over."
       aria-describedby="shelf-status"></div>

  <p class="sr-only" id="shelf-status" role="status" aria-live="polite"></p>

  <!-- ── the active item's copy: title + rows top-left, index bottom-left ── -->
  <aside class="experience_info" data-disc-flight>
    <div class="info-head">
      <h2 class="info-title" data-film-target="title"></h2>
      <div class="info-content">
        <div class="experience_info__field" data-film-field="credit">
          <div class="divider-horizontal"></div>
          <p class="info-label" data-film-target="creditLabel"></p>
          <p class="info-value" data-film-target="credit"></p>
        </div>
        <div class="experience_info__field" data-film-field="year">
          <div class="divider-horizontal"></div>
          <p class="info-label" data-film-target="yearLabel"></p>
          <p class="info-value" data-film-target="year"></p>
        </div>
        <div class="experience_info__field" data-film-field="genre">
          <div class="divider-horizontal"></div>
          <p class="info-label" data-film-target="genreLabel"></p>
          <p class="info-value" data-film-target="genre"></p>
        </div>
        <div class="experience_info__field" data-film-field="secondary">
          <div class="divider-horizontal"></div>
          <p class="info-label" data-film-target="secondaryLabel"></p>
          <p class="info-value" data-film-target="secondary"></p>
        </div>
      </div>
    </div>
    <div class="info-index">
      <span class="info-index__label" data-film-target="section"></span>
      <span class="info-index__count" data-film-target="index"></span>
    </div>
  </aside>

  <!-- The curator's own rating and one-line note, from content/notes.json.
       Never a critic: these are real works, and an invented pull quote would be
       an invented attribution. A title with no rating hides the whole block. -->
  <div class="testimonial_wrap">
    <figure class="testimonial" data-film-field="note">
      <span class="testimonial__stars" data-film-target="stars" aria-hidden="true"></span>
      <div class="testimonial__text">
        <p class="testimonial__source" data-film-target="noteLabel"></p>
        <blockquote class="testimonial__quote" data-film-target="note"></blockquote>
      </div>
    </figure>
  </div>
</main>

<div class="grain" aria-hidden="true"></div>

<!-- ── detail view ────────────────────────────────────────────────────────
     Structure only: src/detail/view.js writes every string from the shelf data,
     and adds the image of a title that has one. One document, two views —
     main.js toggles `data-view` on <html>. -->
<div class="detail" data-detail hidden aria-hidden="true">
  <button type="button" class="detail__back" data-detail-back>Back</button>

  <article class="detail__page" aria-labelledby="detail-title">
    <div class="detail-ink" data-dissolve-track>
      <section class="detail-hero" data-dissolve>
        <span class="detail-plus detail-plus--tl" aria-hidden="true"></span>
        <span class="detail-plus detail-plus--tr" aria-hidden="true"></span>
        <span class="detail-plus detail-plus--bl" aria-hidden="true"></span>
        <span class="detail-plus detail-plus--br" aria-hidden="true"></span>
        <div class="detail-hero__sheet">
          <h1 class="detail-title" id="detail-title" tabindex="-1" data-detail-target="title"></h1>
          <div class="divider-horizontal detail-hero__rule"></div>
          <div class="detail-cols">
            <div class="detail-col">
              <div class="detail-row" data-detail-field="credit">
                <div class="divider-horizontal"></div>
                <p class="info-label" data-detail-target="creditLabel"></p>
                <p class="info-value" data-detail-target="credit"></p>
              </div>
              <div class="detail-row" data-detail-field="secondary">
                <div class="divider-horizontal"></div>
                <p class="info-label" data-detail-target="secondaryLabel"></p>
                <p class="info-value" data-detail-target="secondary"></p>
              </div>
            </div>
            <div class="detail-col">
              <div class="detail-row" data-detail-field="year">
                <div class="divider-horizontal"></div>
                <p class="info-label" data-detail-target="yearLabel"></p>
                <p class="info-value" data-detail-target="year"></p>
              </div>
              <div class="detail-row" data-detail-field="genre">
                <div class="divider-horizontal"></div>
                <p class="info-label" data-detail-target="genreLabel"></p>
                <p class="info-value" data-detail-target="genre"></p>
              </div>
              <div class="detail-row" data-detail-field="runtime">
                <div class="divider-horizontal"></div>
                <p class="info-label" data-detail-target="runtimeLabel"></p>
                <p class="info-value" data-detail-target="runtime"></p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="detail-still" data-detail-still hidden>
        <div class="detail-still__bleed" data-dissolve-bleed></div>
        <p class="detail-still__quote" aria-hidden="true" data-detail-target="stillQuote"></p>
      </section>
    </div>

    <section class="detail-note" data-detail-field="rating" hidden>
      <span class="testimonial__stars" aria-hidden="true" data-detail-target="stars"></span>
      <p class="testimonial__source" data-detail-target="noteLabel"></p>
      <p class="testimonial__quote" data-detail-target="note"></p>
      <p class="sr-only" data-detail-target="ratingText"></p>
    </section>

    <section class="detail-next" data-scroll-next>
      <div class="detail-next__rules" aria-hidden="true">
        <div class="divider-horizontal"></div>
        <div class="divider-horizontal"></div>
        <div class="divider-horizontal"></div>
        <div class="divider-horizontal"></div>
        <div class="divider-horizontal"></div>
      </div>
      <div class="detail-next__canvas" data-scroll-next-canvas aria-hidden="true"></div>
      <a class="detail-next__link" data-scroll-next-link href="#/" data-scroll-next-label>
        <span class="detail-next__kicker" data-scroll-next-kicker></span>
        <span class="detail-next__title" data-scroll-next-title></span>
      </a>
    </section>
  </article>
</div>

<script type="application/json" data-shelf-diag>{}</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
